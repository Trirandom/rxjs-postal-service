<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 140" width="168" height="140">
  <!-- Blue manor: a small abstract house in the back, the mailbox is the main subject -->
  <ellipse cx="84" cy="132" rx="80" ry="6" fill="#60a5fa" opacity="0.25"/>
  <!-- abstract two-storey manor -->
  <rect x="10" y="56" width="56" height="72" rx="4" fill="#bfdbfe"/>
  <path d="M6 60 L38 36 L70 60" fill="none" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="20" y="66" width="12" height="12" rx="3" fill="#fff" opacity="0.85"/>
  <rect x="44" y="66" width="12" height="12" rx="3" fill="#fff" opacity="0.85"/>
  <rect x="20" y="88" width="12" height="12" rx="3" fill="#fff" opacity="0.85"/>
  <rect x="44" y="88" width="12" height="12" rx="3" fill="#fff" opacity="0.85"/>
  <rect x="32" y="106" width="12" height="22" rx="6" fill="#2563eb"/>
  <!-- mailbox (main subject): flag group rotates around its base; rotate it 90deg (CSS transform) to lower it -->
  <g id="mailbox">
    <rect x="104" y="78" width="10" height="56" rx="3" fill="#3b0764"/>
    <rect x="98" y="128" width="22" height="6" rx="3" fill="#2e1065"/>
    <path d="M80 82 V58 Q80 40 98 40 H124 Q142 40 142 58 V82 Z" fill="#3b82f6"/>
    <path d="M124 40 Q142 40 142 58 V82 H124 Z" fill="#000" opacity="0.1"/>
    <path d="M86 56 Q86 46 96 46" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
    <path d="M76 84 V58 Q76 38 92 38 Q86 44 86 58 V84 Z" fill="#1d4ed8"/>
    <rect x="96" y="54" width="28" height="5" rx="2.5" fill="#bfdbfe"/>
    <g transform="rotate(-8 92 40)">
      <rect x="86" y="32" width="22" height="14" rx="2" fill="#fff"/>
      <path d="M87 33 L97 40 L107 33" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="mailbox-flag" style="transform-box: fill-box; transform-origin: 50% 100%;">
      <rect x="142" y="36" width="4" height="34" rx="2" fill="#1e1b2e"/>
      <rect x="146" y="36" width="16" height="11" rx="2.5" fill="#f43f5e"/>
    </g>
  </g>
</svg>
