<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" width="120" height="200">
  <!-- Public collection box (pillar box): domed cap, posting slot, emblem, collection-times plate, plinth -->
  <defs>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="191" rx="42" ry="6" fill="#2e1065" opacity="0.18"/>
  <!-- plinth -->
  <rect x="22" y="170" width="76" height="18" rx="5" fill="#3b0764"/>
  <rect x="26" y="166" width="68" height="8" rx="3" fill="#4c1d95"/>
  <!-- body -->
  <rect x="28" y="58" width="64" height="112" rx="6" fill="url(#body)"/>
  <rect x="33" y="62" width="5" height="102" rx="2.5" fill="#fff" opacity="0.22"/>
  <!-- domed cap -->
  <path d="M24 62 Q24 22 60 20 Q96 22 96 62 Z" fill="url(#cap)"/>
  <path d="M34 50 Q38 30 56 26" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.25"/>
  <rect x="20" y="56" width="80" height="10" rx="5" fill="#4c1d95"/>
  <circle cx="60" cy="17" r="5" fill="#f43f5e"/>
  <!-- posting slot -->
  <rect x="34" y="74" width="52" height="9" rx="4.5" fill="#c4b5fd"/>
  <rect x="38" y="81" width="44" height="8" rx="4" fill="#1e1b2e"/>
  <!-- emblem -->
  <circle cx="60" cy="112" r="15" fill="#f5f3ff"/>
  <rect x="50" y="105" width="20" height="14" rx="2.5" fill="#f43f5e"/>
  <path d="M51 107 L60 114 L69 107" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- collection times plate -->
  <rect x="40" y="136" width="40" height="22" rx="3" fill="#ede9fe"/>
  <rect x="45" y="141" width="22" height="3" rx="1.5" fill="#7c3aed"/>
  <rect x="45" y="147" width="30" height="2.5" rx="1.25" fill="#a78bfa"/>
  <rect x="45" y="152" width="26" height="2.5" rx="1.25" fill="#a78bfa"/>
</svg>
