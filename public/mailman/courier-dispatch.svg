<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Courier dispatch office: rooftop sign with a speeding letter, roll-up loading bay sending a parcel out, side door -->
  <defs>
    <linearGradient id="wall" x1="0" x2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <ellipse cx="80" cy="151" rx="66" ry="6" fill="#2e1065" opacity="0.18"/>
  <!-- rooftop sign -->
  <rect x="76" y="40" width="4" height="12" fill="#4c1d95"/>
  <rect x="40" y="14" width="80" height="30" rx="6" fill="#f5f3ff"/>
  <rect x="44" y="18" width="72" height="22" rx="4" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
  <!-- speed lines + letter: a courier on its way -->
  <rect x="52" y="23" width="14" height="3" rx="1.5" fill="#a78bfa"/>
  <rect x="48" y="28" width="18" height="3" rx="1.5" fill="#7c3aed"/>
  <rect x="54" y="33" width="12" height="3" rx="1.5" fill="#a78bfa"/>
  <rect x="70" y="21" width="26" height="17" rx="2.5" fill="#f43f5e"/>
  <path d="M71.5 23 L83 31 L94.5 23" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100 24 L110 29.5 L100 35" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- walls -->
  <rect x="20" y="60" width="120" height="86" rx="4" fill="url(#wall)"/>
  <rect x="25" y="66" width="5" height="76" rx="2.5" fill="#fff" opacity="0.22"/>
  <!-- roof parapet + beacon -->
  <rect x="14" y="50" width="132" height="14" rx="5" fill="url(#roof)"/>
  <circle cx="132" cy="46" r="5" fill="#f43f5e"/>
  <!-- loading bay: half-raised roll-up door, dark inside, parcel heading out -->
  <rect x="36" y="78" width="60" height="68" rx="3" fill="#3b0764"/>
  <rect x="40" y="82" width="52" height="64" fill="#1e1b2e"/>
  <rect x="40" y="82" width="52" height="30" fill="#ede9fe"/>
  <rect x="40" y="89" width="52" height="2" fill="#c4b5fd"/>
  <rect x="40" y="96" width="52" height="2" fill="#c4b5fd"/>
  <rect x="40" y="103" width="52" height="2" fill="#c4b5fd"/>
  <rect x="40" y="109" width="52" height="3" fill="#a78bfa"/>
  <rect x="54" y="122" width="26" height="24" rx="2" fill="#f59e0b"/>
  <rect x="64" y="122" width="6" height="24" fill="#fcd34d"/>
  <rect x="54" y="130" width="26" height="3" fill="#b45309" opacity="0.35"/>
  <!-- side door -->
  <rect x="106" y="88" width="24" height="58" rx="3" fill="#ede9fe"/>
  <rect x="110" y="92" width="16" height="16" rx="2" fill="#c4b5fd"/>
  <circle cx="125" cy="120" r="2.5" fill="#7c3aed"/>
  <!-- ground strip -->
  <rect x="12" y="144" width="136" height="6" rx="3" fill="#3b0764"/>
</svg>
